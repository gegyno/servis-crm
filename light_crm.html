<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Servis CRM - Terénny Asistent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<!-- PWA Metatagy -->
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#0f172a">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        @media print {
            body { background: white !important; padding: 0 !important; }
            header, nav, #tab-jobs, #tab-clients, #tab-detail, .modal-job, .modal-client, .modal-job-item { display: none !important; }
            #tab-invoice { display: block !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
            input, textarea { border: none !important; outline: none !important; resize: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important; }
            .print-hide { display: none !important; }
            .invoice-container { font-size: 11pt !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20">

    <!-- Horná lišta / Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg leading-tight"><i class="fa-solid fa-wrench text-amber-500 mr-2"></i>Servis CRM</h1>
            <p class="text-xs text-slate-400">Terénny asistent technika</p>
        </div>
        <button onclick="openNewJobModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 shadow">
            <i class="fa-solid fa-plus"></i> Nová zákazka
        </button>
    </header>

    <!-- Hlavný obsah / Taby -->
    <main class="p-4 max-w-lg mx-auto">

        <!-- TAB 1: DNEŠNÉ ZÁKAZKY -->
        <section id="tab-jobs" class="tab-content active">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700 text-base">Zákazky na dnes / blízke dni</h2>
                <span id="job-count" class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
            </div>
            
            <div id="jobs-list" class="space-y-3">
                <!-- Zákazky sa načítajú z SQLite -->
            </div>
        </section>

        <!-- TAB 2: KLIENTI -->
        <section id="tab-clients" class="tab-content">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700 text-base">Zoznam zákazníkov</h2>
                <button onclick="openNewClientModal()" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded text-slate-700 font-medium">
                    + Pridať klienta
                </button>
            </div>
            <div id="clients-list" class="space-y-2">
                <!-- Klienti sa načítajú z SQLite -->
            </div>
        </section>

        <!-- TAB 3: DETAIL ZÁKAZKY -->
        <section id="tab-detail" class="tab-content">
            <button onclick="switchTab('jobs')" class="text-sm text-slate-500 mb-3 flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Späť na prehľad
            </button>
            <div id="job-detail-content">
                <!-- Detail zákazky -->
            </div>
        </section>

        <!-- TAB 4: FAKTÚRA -->
        <section id="tab-invoice" class="tab-content bg-white p-6 rounded-xl shadow-sm">
            <div class="print-hide flex justify-between items-center mb-6 border-b pb-4">
                <button onclick="switchTab('detail')" class="text-sm text-slate-500 flex items-center gap-1 hover:text-slate-700">
                    <i class="fa-solid fa-arrow-left"></i> Späť
                </button>
                <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-print"></i> Tlačiť / Uložiť PDF
                </button>
            </div>
            
            <div class="invoice-container text-sm">
                <!-- Hlavička -->
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <h2 class="text-3xl font-black text-slate-900 mb-1">FAKTÚRA</h2>
                        <div class="flex items-center gap-2 text-slate-600 font-medium">
                            <span>Číslo:</span>
                            <input type="text" id="inv-number" value="2026001" class="border-b border-slate-300 font-bold text-slate-900 w-32 focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="text-right space-y-1 text-slate-600">
                        <div class="flex justify-end items-center gap-2">
                            <span class="w-24">Vystavenie:</span>
                            <input type="date" id="inv-issue-date" class="border border-slate-200 rounded px-2 py-1 text-right w-32">
                        </div>
                        <div class="flex justify-end items-center gap-2">
                            <span class="w-24 font-bold text-slate-800">Splatnosť:</span>
                            <input type="date" id="inv-due-date" class="border border-slate-200 rounded px-2 py-1 text-right w-32 font-bold text-slate-800">
                        </div>
                    </div>
                </div>

                <!-- Dodávateľ a Odberateľ -->
                <div class="grid grid-cols-2 gap-8 mb-8">
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Dodávateľ</h3>
                        <textarea id="inv-supplier" class="w-full h-28 border border-slate-200 rounded p-2 text-slate-800 leading-relaxed" placeholder="Tvoja Firma s.r.o.&#10;Hlavná 1, 811 01 Bratislava&#10;IČO: 12345678&#10;DIČ: 2021234567&#10;IBAN: SK12 3456..."></textarea>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Odberateľ</h3>
                        <textarea id="inv-client" class="w-full h-28 border border-slate-200 rounded p-2 text-slate-800 font-medium leading-relaxed"></textarea>
                    </div>
                </div>

                <!-- Položky -->
                <div class="mb-8">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b-2 border-slate-800 text-slate-800">
                                <th class="py-2 font-bold w-1/2">Popis (Materiál / Práca)</th>
                                <th class="py-2 font-bold text-center">Množstvo</th>
                                <th class="py-2 font-bold text-right">Jedn. cena</th>
                                <th class="py-2 font-bold text-right">Spolu</th>
                            </tr>
                        </thead>
                        <tbody id="inv-items-body" class="divide-y divide-slate-200">
                            <!-- JS vygeneruje riadky -->
                        </tbody>
                        <tfoot>
                            <tr class="border-t-2 border-slate-800">
                                <td colspan="3" class="py-4 text-right font-black text-slate-900 text-lg uppercase tracking-wide">Celkom k úhrade:</td>
                                <td class="py-4 text-right font-black text-indigo-700 text-xl" id="inv-total">0.00 €</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Spodná navigácia pre mobil -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 flex justify-around shadow-lg z-40">
        <button onclick="switchTab('jobs')" id="nav-jobs" class="flex flex-col items-center text-amber-600 font-medium text-xs">
            <i class="fa-solid fa-list-check text-lg mb-0.5"></i>
            Zákazky
        </button>
        <button onclick="switchTab('clients')" id="nav-clients" class="flex flex-col items-center text-slate-400 font-medium text-xs">
            <i class="fa-solid fa-users text-lg mb-0.5"></i>
            Klienti
        </button>
    </nav>

    <!-- MODAL: Nová / Edit Zákazka -->
    <div id="modal-job" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <h3 id="modal-job-title" class="font-bold text-lg border-b pb-2">Vytvoriť novú zákazku</h3>
            <form id="form-job" onsubmit="saveJob(event)" class="space-y-3">
                <input type="hidden" id="job-id-input">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Zákazník</label>
                    <select id="job-client-select" class="w-full border rounded-lg p-2 text-sm bg-slate-50" required></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Názov / Popis práce</label>
                    <input type="text" id="job-title" placeholder="napr. Ročný servis plynového kotla" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Termín / Dátum a čas</label>
                    <input type="datetime-local" id="job-date" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Poznámky</label>
                    <textarea id="job-notes" placeholder="Voliteľné poznámky..." class="w-full border rounded-lg p-2 text-sm" rows="2"></textarea>
                </div>
                <div class="flex gap-2 justify-end pt-2">
                    <button type="button" onclick="closeModal('modal-job')" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-lg">Zrušiť</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-amber-500 hover:bg-amber-600 font-bold rounded-lg text-slate-900">Uložiť zákazku</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Klient -->
    <div id="modal-client" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <h3 id="modal-client-title" class="font-bold text-lg border-b pb-2">Pridať nového klienta</h3>
            <form id="form-client" onsubmit="saveClient(event)" class="space-y-3">
                <input type="hidden" id="client-id-input">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Meno a Priezvisko / Firma</label>
                    <input type="text" id="client-name" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Telefónne číslo</label>
                    <input type="tel" 
                           id="client-phone" 
                           placeholder="+421 905 123 456" 
                           pattern="^\+\d{3}\s\d{3}\s\d{3}\s\d{3}$" 
                           title="Zadajte číslo vo formáte +XXX YYY ZZZ ZZZ (napr. +421 905 123 456)" 
                           oninput="formatPhoneNumber(this)"
                           class="w-full border rounded-lg p-2 text-sm" 
                           required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Adresa / Miesto servisu</label>
                    <input type="text" id="client-address" placeholder="Ulica, Mesto" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div class="flex gap-2 justify-end pt-2">
                    <button type="button" onclick="closeModal('modal-client')" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-lg">Zrušiť</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-amber-500 hover:bg-amber-600 font-bold rounded-lg text-slate-900">Uložiť klienta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Položka protokolu -->
    <div id="modal-job-item" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden modal-job-item">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl space-y-4">
            <h3 class="font-bold text-lg border-b pb-2">Pridať položku</h3>
            <form id="form-job-item" onsubmit="saveJobItem(event)" class="space-y-3">
                <input type="hidden" id="item-job-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Názov (Práca / Materiál)</label>
                    <input type="text" id="item-name" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Množstvo</label>
                        <input type="number" step="0.01" id="item-quantity" value="1" class="w-full border rounded-lg p-2 text-sm" required>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Cena za jedn. (€)</label>
                        <input type="number" step="0.01" id="item-price" class="w-full border rounded-lg p-2 text-sm" required>
                    </div>
                </div>
                <div class="flex gap-2 justify-end pt-2">
                    <button type="button" onclick="closeModal('modal-job-item')" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-lg">Zrušiť</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 font-bold rounded-lg text-white">Pridať položku</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let db = null;

        // AUTOMATICKÉ FORMÁTOVANIE TELEFÓNNEHO ČÍSLA: +XXX YYY ZZZ ZZZ
        function formatPhoneNumber(input) {
            let value = input.value;
            let hasPlus = value.startsWith('+');
            let digits = value.replace(/\D/g, '');

            let formatted = hasPlus || digits.length > 0 ? '+' + digits : '';

            if (digits.length > 3) {
                formatted = '+' + digits.substring(0, 3) + ' ' + digits.substring(3);
            }
            if (digits.length > 6) {
                formatted = '+' + digits.substring(0, 3) + ' ' + digits.substring(3, 6) + ' ' + digits.substring(6);
            }
            if (digits.length > 9) {
                formatted = '+' + digits.substring(0, 3) + ' ' + digits.substring(3, 6) + ' ' + digits.substring(6, 9) + ' ' + digits.substring(9, 12);
            }

            input.value = formatted.substring(0, 16);
        }

        // INDEXEDDB LOGIKA
        function openIDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('CRM_Database', 1);
                request.onupgradeneeded = e => e.target.result.createObjectStore('sqlite_store');
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }

        async function saveDatabase() {
            if (!db) return;
            const data = db.export();
            const idb = await openIDB();
            const tx = idb.transaction('sqlite_store', 'readwrite');
            tx.objectStore('sqlite_store').put(data, 'db_bytes');
        }

        async function loadDatabaseBytes() {
            const idb = await openIDB();
            return new Promise((resolve) => {
                const tx = idb.transaction('sqlite_store', 'readonly');
                const req = tx.objectStore('sqlite_store').get('db_bytes');
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        // INICIALIZÁCIA DATABÁZY
        async function initDatabase() {
            const config = { locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` };
            const SQL = await initSqlJs(config);
            
            const savedBytes = await loadDatabaseBytes();
            if (savedBytes) {
                db = new SQL.Database(savedBytes);
            } else {
                db = new SQL.Database();
            }

            db.run(`
                CREATE TABLE IF NOT EXISTS clients (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    name TEXT NOT NULL,
                    phone TEXT NOT NULL,
                    address TEXT NOT NULL
                );
                CREATE TABLE IF NOT EXISTS jobs (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    client_id INTEGER,
                    title TEXT NOT NULL,
                    status TEXT DEFAULT 'Čaká',
                    scheduled_at TEXT,
                    notes TEXT,
                    FOREIGN KEY(client_id) REFERENCES clients(id)
                );
                CREATE TABLE IF NOT EXISTS job_items (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    job_id INTEGER,
                    name TEXT NOT NULL,
                    quantity REAL NOT NULL,
                    price REAL NOT NULL,
                    FOREIGN KEY(job_id) REFERENCES jobs(id)
                );
                CREATE TABLE IF NOT EXISTS job_photos (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    job_id INTEGER,
                    type TEXT,
                    photo_data TEXT NOT NULL,
                    FOREIGN KEY(job_id) REFERENCES jobs(id)
                );
            `);

            if (!savedBytes) {
                db.run(`
                    INSERT INTO clients (name, phone, address) VALUES 
                    ('Ján Novák', '+421 905 123 456', 'Hlavná 14, Senica'),
                    ('Miroslav Kováč', '+421 911 987 654', 'Štefánikova 8, Trnava');

                    INSERT INTO jobs (client_id, title, status, scheduled_at, notes) VALUES 
                    (1, 'Oprava úniku vody z kotla', 'V riešení', '2026-08-12 10:00', 'Starší model Viessmann, zobrať tesnenia.'),
                    (2, 'Garančná revízia tepelného čerpadla', 'Čaká', '2026-08-12 14:30', 'Upozorniť na výmenu filtra.');
                `);
                await saveDatabase();
            }

            renderJobs();
            renderClients();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            const isJobs = tabName === 'jobs';
            document.getElementById('nav-jobs').className = `flex flex-col items-center font-medium text-xs ${isJobs ? 'text-amber-600' : 'text-slate-400'}`;
            document.getElementById('nav-clients').className = `flex flex-col items-center font-medium text-xs ${!isJobs ? 'text-amber-600' : 'text-slate-400'}`;
        }

        function renderJobs() {
            const stmt = db.prepare(`
                SELECT jobs.id, jobs.title, jobs.status, jobs.scheduled_at, clients.name, clients.phone, clients.address 
                FROM jobs 
                JOIN clients ON jobs.client_id = clients.id
                ORDER BY jobs.scheduled_at ASC
            `);

            const container = document.getElementById('jobs-list');
            container.innerHTML = '';
            let count = 0;

            while (stmt.step()) {
                count++;
                const [id, title, status, scheduledAt, clientName, phone, address] = stmt.get();
                
                let statusBadge = 'bg-slate-100 text-slate-700';
                if (status === 'V riešení') statusBadge = 'bg-amber-100 text-amber-800 border border-amber-300';
                if (status === 'Dokončené') statusBadge = 'bg-emerald-100 text-emerald-800';
                if (status === 'Fakturované') statusBadge = 'bg-indigo-100 text-indigo-800';
                if (status === 'Uhradené') statusBadge = 'bg-cyan-100 text-cyan-800 border border-cyan-300';

                const card = `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${statusBadge}">${status}</span>
                            <span class="text-xs font-medium text-slate-500"><i class="fa-regular fa-clock mr-1"></i>${scheduledAt.split(' ')[1] || scheduledAt}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mb-1">${title}</h3>
                        <p class="text-xs text-slate-600 font-medium mb-3"><i class="fa-solid fa-user text-slate-400 mr-1.5"></i>${clientName}</p>

                        <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                            <a href="tel:${phone}" class="flex items-center justify-center gap-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 py-2 rounded-lg text-xs font-bold transition">
                                <i class="fa-solid fa-phone"></i> Volať
                            </a>
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}" target="_blank" class="flex items-center justify-center gap-1 bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 rounded-lg text-xs font-bold transition">
                                <i class="fa-solid fa-location-dot"></i> Navigovať
                            </a>
                            <button onclick="openJobDetail(${id})" class="flex items-center justify-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-bold transition">
                                Detail <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            }
            stmt.free();

            document.getElementById('job-count').innerText = count;
            if (count === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Žiadne aktívne zákazky.</p>';
            }
        }

        function renderClients() {
            const stmt = db.prepare("SELECT id, name, phone, address FROM clients");
            const container = document.getElementById('clients-list');
            const select = document.getElementById('job-client-select');
            
            container.innerHTML = '';
            select.innerHTML = '';

            while (stmt.step()) {
                const [id, name, phone, address] = stmt.get();
                
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-sm text-slate-800">${name}</h4>
                            <p class="text-xs text-slate-500">${address}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openEditClientModal(${id})" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs transition" title="Upraviť">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <a href="tel:${phone}" class="p-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg text-xs transition" title="Volať">
                                <i class="fa-solid fa-phone"></i>
                            </a>
                        </div>
                    </div>
                `;

                select.innerHTML += `<option value="${id}">${name} (${address})</option>`;
            }
            stmt.free();
        }

        function openJobDetail(jobId) {
            const stmt = db.prepare(`
                SELECT jobs.id, jobs.title, jobs.status, jobs.scheduled_at, jobs.notes, clients.name, clients.phone, clients.address 
                FROM jobs JOIN clients ON jobs.client_id = clients.id
                WHERE jobs.id = ?
            `);
            stmt.bind([jobId]);

            if (!stmt.step()) { stmt.free(); return; }
            const [id, title, status, scheduledAt, notes, clientName, phone, address] = stmt.get();
            stmt.free();

            let detailStatusClass = 'bg-slate-100 text-slate-700';
            if (status === 'V riešení') detailStatusClass = 'bg-amber-100 text-amber-800';
            if (status === 'Dokončené') detailStatusClass = 'bg-emerald-100 text-emerald-800';
            if (status === 'Fakturované') detailStatusClass = 'bg-indigo-100 text-indigo-800';
            if (status === 'Uhradené') detailStatusClass = 'bg-cyan-100 text-cyan-800 border border-cyan-300';

            let statusButtons = '';
            if (status !== 'Dokončené' && status !== 'Fakturované' && status !== 'Uhradené') {
                statusButtons += `
                    <button onclick="updateStatus(${id}, 'Dokončené')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
                        <i class="fa-solid fa-check mr-1"></i> Označiť ako Dokončené
                    </button>`;
            }
            if (status === 'Fakturované') {
                statusButtons += `
                    <button onclick="markPaid(${id})" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
                        <i class="fa-solid fa-coins mr-1"></i> Označiť ako Uhradené
                    </button>`;
            }

            const detailContainer = document.getElementById('job-detail-content');
            detailContainer.innerHTML = `
                <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${detailStatusClass}">${status}</span>
                        <span class="text-xs text-slate-500">${scheduledAt}</span>
                    </div>

                    <h2 class="text-xl font-bold text-slate-900">${title}</h2>

                    <div class="bg-slate-50 p-3 rounded-lg space-y-1 text-sm">
                        <p class="font-semibold text-slate-800"><i class="fa-solid fa-user mr-2 text-slate-400"></i>${clientName}</p>
                        <p class="text-slate-600"><i class="fa-solid fa-location-dot mr-2 text-slate-400"></i>${address}</p>
                        <p class="text-slate-600"><i class="fa-solid fa-phone mr-2 text-slate-400"></i>${phone}</p>
                    </div>

                    <div>
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Poznámky k práci</h4>
                        <p class="text-sm text-slate-700 bg-amber-50/50 p-3 rounded-lg border border-amber-100">${notes || 'Bez poznámky.'}</p>
                    </div>

                    <!-- Servisný protokol -->
                    <div class="pt-4 border-t border-slate-200">
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Servisný protokol (Materiál/Práca)</h4>
                            <button onclick="openJobItemModal(${id})" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-2 py-1 rounded">
                                + Pridať položku
                            </button>
                        </div>
                        <div class="bg-slate-50 rounded-lg border border-slate-200 overflow-hidden mb-3">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-100 text-slate-500 border-b border-slate-200">
                                    <tr>
                                        <th class="p-2 font-semibold">Položka</th>
                                        <th class="p-2 font-semibold text-center">Mn.</th>
                                        <th class="p-2 font-semibold text-right">Spolu</th>
                                        <th class="p-2"></th>
                                    </tr>
                                </thead>
                                <tbody id="job-items-list" class="divide-y divide-slate-200"></tbody>
                                <tfoot>
                                    <tr class="bg-indigo-50 font-bold text-indigo-900 text-sm border-t border-slate-200">
                                        <td colspan="2" class="p-2 text-right">Celkom:</td>
                                        <td id="job-items-total" class="p-2 text-right">0.00 €</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        ${status !== 'Uhradené' ? `
                        <button onclick="generateInvoice(${id}, \`${clientName}\`, \`${address}\`, \`${phone}\`)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2 shadow">
                            <i class="fa-solid fa-file-invoice"></i> Vystaviť faktúru
                        </button>
                        ` : ''}
                    </div>

                    <!-- Nahrávanie a Zobrazenie Fotiek Pred/Po -->
                    <div class="pt-4 border-t border-slate-200">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Fotodokumentácia (Pred / Po)</h4>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <label class="border-2 border-dashed border-slate-300 rounded-lg p-3 text-center cursor-pointer hover:bg-slate-50">
                                <i class="fa-solid fa-camera text-slate-400 text-lg block mb-1"></i>
                                <span class="text-xs font-semibold text-slate-600">Pridať PRED</span>
                                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="uploadPhoto(${id}, 'before', this)">
                            </label>
                            <label class="border-2 border-dashed border-slate-300 rounded-lg p-3 text-center cursor-pointer hover:bg-slate-50">
                                <i class="fa-solid fa-camera text-slate-400 text-lg block mb-1"></i>
                                <span class="text-xs font-semibold text-slate-600">Pridať PO</span>
                                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="uploadPhoto(${id}, 'after', this)">
                            </label>
                        </div>

                        <!-- Mriežka uložených fotiek -->
                        <div id="photos-grid-${id}" class="grid grid-cols-2 gap-2"></div>
                    </div>

                    <!-- Akcie a Mazanie zákazky -->
                    <div class="pt-4 border-t border-slate-200 space-y-2">
                        <button onclick="openEditJobModal(${id})" class="w-full bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-2.5 rounded-lg text-sm transition border border-amber-300">
                            <i class="fa-solid fa-pen mr-1"></i> Upraviť zákazku
                        </button>
                        ${statusButtons}
                        <button onclick="deleteJob(${id})" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded-lg text-xs transition border border-red-200">
                            <i class="fa-solid fa-trash-can mr-1"></i> Vymazať zákazku
                        </button>
                    </div>
                </div>
            `;

            switchTab('detail');
            renderJobItems(id);
            renderPhotos(id);
        }

        // FOTO LOGIKA
        async function uploadPhoto(jobId, type, inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                db.run(`INSERT INTO job_photos (job_id, type, photo_data) VALUES (?, ?, ?)`, [jobId, type, base64Image]);
                await saveDatabase();
                renderPhotos(jobId);
            };
            reader.readAsDataURL(file);
        }

        function renderPhotos(jobId) {
            const container = document.getElementById(`photos-grid-${jobId}`);
            if (!container) return;

            const stmt = db.prepare(`SELECT id, type, photo_data FROM job_photos WHERE job_id = ?`);
            stmt.bind([jobId]);

            container.innerHTML = '';
            while (stmt.step()) {
                const [photoId, type, photoData] = stmt.get();
                const typeLabel = type === 'before' ? 'PRED' : 'PO';
                const badgeColor = type === 'before' ? 'bg-amber-500' : 'bg-emerald-500';

                container.innerHTML += `
                    <div class="relative rounded-lg overflow-hidden border border-slate-200 shadow-sm group">
                        <img src="${photoData}" class="w-full h-28 object-cover">
                        <span class="absolute top-1 left-1 text-[10px] font-bold text-white ${badgeColor} px-1.5 py-0.5 rounded shadow">
                            ${typeLabel}
                        </span>
                        <button onclick="deletePhoto(${photoId}, ${jobId})" class="absolute top-1 right-1 bg-red-600/80 hover:bg-red-600 text-white p-1 rounded-full text-xs">
                            <i class="fa-solid fa-xmark w-3 h-3 flex items-center justify-center"></i>
                        </button>
                    </div>
                `;
            }
            stmt.free();
        }

        async function deletePhoto(photoId, jobId) {
            if (confirm('Vymazať túto fotku?')) {
                db.run(`DELETE FROM job_photos WHERE id = ?`, [photoId]);
                await saveDatabase();
                renderPhotos(jobId);
            }
        }

        async function updateStatus(jobId, newStatus) {
            db.run(`UPDATE jobs SET status = ? WHERE id = ?`, [newStatus, jobId]);
            await saveDatabase();
            renderJobs();
            openJobDetail(jobId);
        }

        async function markPaid(jobId) {
            db.run(`UPDATE jobs SET status = 'Uhradené' WHERE id = ?`, [jobId]);
            await saveDatabase();
            renderJobs();
            openJobDetail(jobId);
        }

        async function deleteJob(jobId) {
            if (confirm('Naozaj chcete vymazať túto zákazku aj so všetkými položkami a fotkami?')) {
                db.run(`DELETE FROM job_photos WHERE job_id = ?`, [jobId]);
                db.run(`DELETE FROM job_items WHERE job_id = ?`, [jobId]);
                db.run(`DELETE FROM jobs WHERE id = ?`, [jobId]);
                await saveDatabase();
                renderJobs();
                switchTab('jobs');
            }
        }

        function openNewJobModal() {
            document.getElementById('modal-job-title').innerText = 'Vytvoriť novú zákazku';
            document.getElementById('job-id-input').value = '';
            document.getElementById('job-client-select').selectedIndex = 0;
            document.getElementById('job-title').value = '';
            document.getElementById('job-date').value = '';
            document.getElementById('job-notes').value = '';
            document.getElementById('modal-job').classList.remove('hidden');
        }

        function openEditJobModal(jobId) {
            const stmt = db.prepare(`SELECT client_id, title, scheduled_at, notes FROM jobs WHERE id = ?`);
            stmt.bind([jobId]);
            if (!stmt.step()) { stmt.free(); return; }
            const [clientId, title, scheduledAt, notes] = stmt.get();
            stmt.free();

            document.getElementById('modal-job-title').innerText = 'Upraviť zákazku';
            document.getElementById('job-id-input').value = jobId;
            document.getElementById('job-client-select').value = clientId;
            document.getElementById('job-title').value = title;
            document.getElementById('job-date').value = scheduledAt.replace(' ', 'T');
            document.getElementById('job-notes').value = notes || '';
            document.getElementById('modal-job').classList.remove('hidden');
        }

        function openNewClientModal() {
            document.getElementById('modal-client-title').innerText = 'Pridať nového klienta';
            document.getElementById('client-id-input').value = '';
            document.getElementById('client-name').value = '';
            document.getElementById('client-phone').value = '';
            document.getElementById('client-address').value = '';
            document.getElementById('modal-client').classList.remove('hidden');
        }

        function openEditClientModal(clientId) {
            const stmt = db.prepare(`SELECT name, phone, address FROM clients WHERE id = ?`);
            stmt.bind([clientId]);
            if (!stmt.step()) { stmt.free(); return; }
            const [name, phone, address] = stmt.get();
            stmt.free();

            document.getElementById('modal-client-title').innerText = 'Upraviť klienta';
            document.getElementById('client-id-input').value = clientId;
            document.getElementById('client-name').value = name;
            document.getElementById('client-phone').value = phone;
            document.getElementById('client-address').value = address;
            document.getElementById('modal-client').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function saveJob(e) {
            e.preventDefault();
            const jobId = document.getElementById('job-id-input').value;
            const clientId = document.getElementById('job-client-select').value;
            const title = document.getElementById('job-title').value;
            const date = document.getElementById('job-date').value.replace('T', ' ');
            const notes = document.getElementById('job-notes').value;

            if (jobId) {
                db.run(`UPDATE jobs SET client_id = ?, title = ?, scheduled_at = ?, notes = ? WHERE id = ?`, [clientId, title, date, notes, jobId]);
                if (document.getElementById('tab-detail').classList.contains('active')) {
                    openJobDetail(jobId);
                }
            } else {
                db.run(`INSERT INTO jobs (client_id, title, status, scheduled_at, notes) VALUES (?, ?, 'Čaká', ?, ?)`, [clientId, title, date, notes]);
            }
            
            await saveDatabase();
            closeModal('modal-job');
            renderJobs();
        }

        async function saveClient(e) {
            e.preventDefault();
            const clientId = document.getElementById('client-id-input').value;
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            const address = document.getElementById('client-address').value;

            if (clientId) {
                db.run(`UPDATE clients SET name = ?, phone = ?, address = ? WHERE id = ?`, [name, phone, address, clientId]);
            } else {
                db.run(`INSERT INTO clients (name, phone, address) VALUES (?, ?, ?)`, [name, phone, address]);
            }
            
            await saveDatabase();
            closeModal('modal-client');
            renderClients();
            renderJobs();
        }

        function openJobItemModal(jobId) {
            document.getElementById('item-job-id').value = jobId;
            document.getElementById('item-name').value = '';
            document.getElementById('item-quantity').value = 1;
            document.getElementById('item-price').value = '';
            document.getElementById('modal-job-item').classList.remove('hidden');
        }

        async function saveJobItem(e) {
            e.preventDefault();
            const jobId = document.getElementById('item-job-id').value;
            const name = document.getElementById('item-name').value;
            const quantity = parseFloat(document.getElementById('item-quantity').value);
            const price = parseFloat(document.getElementById('item-price').value);

            db.run(`INSERT INTO job_items (job_id, name, quantity, price) VALUES (?, ?, ?, ?)`, [jobId, name, quantity, price]);
            await saveDatabase();
            closeModal('modal-job-item');
            renderJobItems(jobId);
        }

        async function deleteJobItem(itemId, jobId) {
            if (confirm('Naozaj vymazať túto položku?')) {
                db.run(`DELETE FROM job_items WHERE id = ?`, [itemId]);
                await saveDatabase();
                renderJobItems(jobId);
            }
        }

        function renderJobItems(jobId) {
            const stmt = db.prepare(`SELECT id, name, quantity, price FROM job_items WHERE job_id = ?`);
            stmt.bind([jobId]);
            
            const tbody = document.getElementById('job-items-list');
            const totalEl = document.getElementById('job-items-total');
            if (!tbody) { stmt.free(); return; }

            tbody.innerHTML = '';
            let total = 0;
            let hasItems = false;

            while (stmt.step()) {
                hasItems = true;
                const [id, name, qty, price] = stmt.get();
                const itemTotal = qty * price;
                total += itemTotal;
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2 text-slate-800">${name}</td>
                        <td class="p-2 text-center text-slate-600">${qty}</td>
                        <td class="p-2 text-right font-medium text-slate-800">${itemTotal.toFixed(2)} €</td>
                        <td class="p-2 text-center">
                            <button onclick="deleteJobItem(${id}, ${jobId})" class="text-red-500 hover:text-red-700" title="Zmazať"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            }
            stmt.free();

            if (!hasItems) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-400">Zatiaľ žiadne položky</td></tr>`;
            }

            totalEl.innerText = `${total.toFixed(2)} €`;
        }

        async function generateInvoice(jobId, clientName, address, phone) {
            db.run(`UPDATE jobs SET status = 'Fakturované' WHERE id = ?`, [jobId]);
            await saveDatabase();
            renderJobs();

            document.getElementById('inv-client').value = `${clientName}\n${address}\nTel: ${phone}`;
            
            const today = new Date();
            const due = new Date();
            due.setDate(today.getDate() + 14);
            
            document.getElementById('inv-issue-date').value = today.toISOString().split('T')[0];
            document.getElementById('inv-due-date').value = due.toISOString().split('T')[0];
            document.getElementById('inv-number').value = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2,'0')}${jobId.toString().padStart(3,'0')}`;

            const stmt = db.prepare(`SELECT name, quantity, price FROM job_items WHERE job_id = ?`);
            stmt.bind([jobId]);

            const tbody = document.getElementById('inv-items-body');
            const totalEl = document.getElementById('inv-total');
            
            tbody.innerHTML = '';
            let total = 0;
            let hasItems = false;

            while (stmt.step()) {
                hasItems = true;
                const [name, qty, price] = stmt.get();
                const itemTotal = qty * price;
                total += itemTotal;
                tbody.innerHTML += `
                    <tr>
                        <td class="py-2 text-slate-800">${name}</td>
                        <td class="py-2 text-center text-slate-600">${qty}</td>
                        <td class="py-2 text-right text-slate-600">${price.toFixed(2)} €</td>
                        <td class="py-2 text-right font-bold text-slate-900">${itemTotal.toFixed(2)} €</td>
                    </tr>
                `;
            }
            stmt.free();

            if (!hasItems) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400 italic">Faktúra neobsahuje žiadne položky. Pridajte ich v servisnom protokole.</td></tr>`;
            }

            totalEl.innerText = `${total.toFixed(2)} €`;
            switchTab('invoice');
        }
		// Registrácia PWA Service Workera
		if ('serviceWorker' in navigator) {
		navigator.serviceWorker.register('sw.js')
			.then(() => console.log('Service Worker zaregistrovaný'))
			.catch(err => console.error('Chyba pri registrácii SW:', err));
}
        window.onload = initDatabase;
    </script>
</body>
</html>
